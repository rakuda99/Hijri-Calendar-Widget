plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.hijricalendarwidget'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hijricalendarwidget"
        minSdk 24
        targetSdk 34
        versionCode 57
        versionName "5.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def timestamp = new java.text.SimpleDateFormat("yyyyMMdd_HHmm").format(new Date())
            outputFileName = "HijriWidget_v${variant.versionName}_Build${variant.versionCode}_${timestamp}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}